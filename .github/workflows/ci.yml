name: Verify private group chat
on: [workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: mkdir -p .openai && cp config/hosting.local.example.json .openai/hosting.json
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npx playwright install --with-deps chromium
      - name: Mocked UI verification without provider credentials
        run: |
          npm run dev -- --host 127.0.0.1 --port 4784 > /tmp/preview.log 2>&1 &
          for n in $(seq 1 90); do curl -sf http://127.0.0.1:4784/ >/dev/null && break; sleep 1; done
          npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulated-chat-ui
          path: test-results/
